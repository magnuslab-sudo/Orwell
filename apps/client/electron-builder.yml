# Orwell's installers.
#
# Unsigned, owner's decision Aug 12, 2026, with the cost spelled out on the
# downloads page: on macOS the first launch requires approval in System Settings,
# and on Windows the blue SmartScreen screen appears. It's the price of not
# paying annual rent to two companies to distribute our own code; the alternative
# costs 99 USD/year from Apple plus Windows certificate, saved for when there's
# a good reason.
#
# Defense against a tampered file is different, and it exists: each installer
# is published alongside its SHA-256 sum. See `scripts/publicar-instaladores.mjs`.

# Electron version, explicit not inferred.
#
# `package.json` declares a range (`^43.2.0`), which is what we want to get
# security fixes without editing anything. The packager needs an exact number-
# it downloads binaries from a specific version-and refuses to guess. When the
# range bumps a major, this number rises with it.
electronVersion: 43.2.0

# Names without spaces, with the OS explicit.
#
# NSIS called it "Orwell Setup 0.1.0.exe", and a space in a URL becomes %20-
# ugly to read and easy to break when someone copies the address into a message.
# The OS goes in the name because whoever downloads two similar files needs to
# know which one is theirs after they land in the same folder.
#
# The OS goes written in each target, not via `${os}`. That placeholder returned
# "macos"/"windows" in one build and "mac"/"win" in the next, and the result was
# a folder with four installers in two different names and a downloads page
# offering all four-two of them stale. Published names are also addresses people
# copy: they change when there's a reason, not when a dependency changes its mind.
artifactName: "${productName}-${version}-${arch}.${ext}"

appId: pt.orwell.app
productName: Orwell
copyright: "Copyright © 2026 Duarte Bivar"

directories:
  # `out/` is from electron-vite; installers go elsewhere to keep them separate
  # from built code.
  output: ../../.verify-data/instaladores
  buildResources: recursos

# What goes into the package, and nothing else. `out/` is what electron-vite
# produced; production `node_modules` are included by default.
files:
  - out/**/*
  - package.json

# The license (AGPL-3.0), copyright notice, and third-party notices, alongside
# the app (folder `resources/` on Windows, `Contents/Resources/` on macOS).
# AGPL and the third-party licenses bundled require the notice to travel with
# each copy. The file is generated by `scripts/gerar-avisos-de-terceiros.mjs`;
# a test fails if it goes stale.
extraResources:
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../NOTICE
    to: NOTICE.txt
  - from: ../../THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

# No auto-publish. Files are copied to the VPS by our script, and a forgotten
# `publish` here would try to talk to GitHub.
publish: null

mac:
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"
  target:
    # One universal DMG: one file for Intel and Apple Silicon. It costs about twice
    # the size and saves the question "which one is mine?"-which is where most
    # people give up.
    - target: dmg
      arch:
        - universal
  category: public.app-category.social
  # System audio when sharing the screen (macOS 14.2+). Without this key macOS
  # won't even ask, and the audio track arrives silent. See `somDoSistema` in
  # `src/main/ecra.ts`.
  extendInfo:
    NSAudioCaptureUsageDescription: "O Orwell usa o som do sistema quando partilhas o ecrã numa chamada."
  # No signing identity, stated here so the build won't look for it and die on a
  # machine that has it configured for something else.
  identity: null
  # Notarization requires signing; without it, this must stay off.
  notarize: false

dmg:
  # The drag-to-Applications window, which is the gesture everyone knows on macOS.
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"
  target:
    - target: nsis
      arch:
        - x64
  # No signing: see the header.
  signAndEditExecutable: true

nsis:
  oneClick: false
  # The installer asks where to install. An installer that doesn't ask looks like
  # one hiding something.
  allowToChangeInstallationDirectory: true
  # Always "just for me", in %LOCALAPPDATA%\Programs\Orwell (owner's decision
  # Nov 3, 2026). Per-user install updates without admin. The "for everyone or
  # just me" page is removed by `recursos/installer.nsh`: with `oneClick: false`,
  # this option can't be removed without also removing the folder choice. See the
  # header of that file.
  perMachine: false
  # No "for everyone" button for non-admins. The page no longer appears; this is
  # documented so it won't offer UAC again if someone restores it.
  allowElevation: false
  include: installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The installer artwork: direction B ("Banners"), chosen by owner Nov 3, 2026,
  # same as the boot screen. 24-bit BMP in the dimensions NSIS wants (164×314
  # sidebar, 150×57 header), in `recursos/`. The uninstaller sidebar is the same:
  # whoever uninstalls is leaving the same house. See `src/main/ecra-de-arranque.test.ts`.
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp
  installerHeader: installerHeader.bmp

linux:
  # Not a target today, and it's documented: owner said "right now we're PC only",
  # and an AppImage to build is better than one to test.
  target: []
