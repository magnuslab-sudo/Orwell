<!--
  The app icon: the mark on the deep background of the app itself.

  The banners are from `OrwellMark` (`packages/ui/src/icons.tsx`), generated not
  redesigned: the dock icon must be the same as the top-left corner of the
  window. The O is a redacted O-text covered with marker, turned inside out:
  here the banner protects the writer.

  Rounded corner background because macOS won't round it for us in `.icns`, and
  a perfect square on the dock reads as an unfinished app.

  This is the large design. The 16 and 32 from `.icns` and `.ico` don't come
  from here via shrinking-they come from the compact variant, rasterized to
  size. Shrinking seven banners to 32 pixels gives blur, and it's at 32 that
  this icon appears in the app list.

  DO NOT EDIT BY HAND: comes from `marca/gerar-marca.py`.
-->
