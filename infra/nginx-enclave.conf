# Host-nginx server block for orwell.pt (behind-proxy mode; see .env.example).
# On the VPS: copy to /etc/nginx/sites-available/orwell.pt, link into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
# Certificates (only after DNS points here): `certbot --nginx -d orwell.pt -d www.orwell.pt`
#
# Everything proxies to the enclave web container on 127.0.0.1:8080, which
# serves the app and forwards /_enclave/* (gateway WebSocket included) to the
# homeserver container.

server {
    listen 80;
    listen [::]:80;
    server_name orwell.pt www.orwell.pt;
    return 301 https://orwell.pt$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.orwell.pt;

    ssl_certificate     /etc/letsencrypt/live/orwell.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orwell.pt/privkey.pem;

    # Addresses embed "orwell.pt", never "www" — one canonical name.
    return 301 https://orwell.pt$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name orwell.pt;

    ssl_certificate     /etc/letsencrypt/live/orwell.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orwell.pt/privkey.pem;

    # Frames carry base64 ciphertext of image posts; match the gateway's cap.
    client_max_body_size 24m;

    # Local-only access record, at the operator's choice. It sees IPs and
    # connection times — transport metadata this box already observes — and
    # never content, which arrives here already encrypted. Rotated by the
    # stock nginx logrotate rule.
    access_log /var/log/nginx/orwell.access.log;
    error_log /var/log/nginx/orwell.error.log;

    # Security headers, the same as the production vhost (ORW-05, November 4,
    # 2026). They live here at the server level, not in the Caddyfile:
    # in production nginx sets them, and Caddy behind would duplicate
    # each header. No `location` in this block can have its own `add_header`:
    # nginx would stop inheriting all of these.
    #
    # The CSP mirrors the <meta> in apps/web/index.html, with three differences:
    # it closes the ws:// of localhost, adds frame-ancestors (impossible via <meta>)
    # and declares worker-src. The 'wasm-unsafe-eval' must be in both: the
    # browser enforces both policies, and without it in the header the gtcrn.wasm noise
    # reduction does not compile (blocked in production until 4/11/2026).
    # apps/site/testes/cabecalhos.test.ts reads this file and asserts them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://orwell.pt; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The caller's IP, OVERWRITTEN not accumulated (NET-01, 1.2.1): any
        # X-Forwarded-For the client sends does not pass through here. Caddy trusts
        # this hop (see infra/Caddyfile, trusted_proxies).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /_enclave/gateway, harmless for the rest.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A quiet chat socket is still a live socket; do not reap it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
